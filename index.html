<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Chriselle ✨</title>
    <style>
        body {
            background: #050505;
            color: #fff;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .container {
            z-index: 10;
            padding: 40px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 30px;
            border: 2px solid #d4af37; /* Gold border */
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
        }
        h1 { font-size: 2.2rem; color: #d4af37; margin-bottom: 10px; }
        #timer { font-size: 2.8rem; font-weight: bold; margin: 20px 0; color: #fff; text-shadow: 0 0 10px gold; }
        .btn {
            background: #d4af37;
            color: #000;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.1); box-shadow: 0 0 30px #d4af37; }
        
        /* Fireworks Animation Effect */
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 #fff, 0 0 #fff, 0 0 #fff;
            animation: explode 2s infinite;
        }
        @keyframes explode {
            0% { transform: translateY(100vh); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(20); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hi Chriselle! ✨</h1>
        <p>Counting down to our best year yet...</p>
        <div id="timer">Loading...</div>
        <a href="notes.html" class="btn">🎁 Open Jose's Message</a>
    </div>

    <script>
        function updateTimer() {
            const nextYear = new Date("January 1, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = nextYear - now;

            if (diff <= 0) {
                document.getElementById("timer").innerHTML = "HAPPY 2026! 🎉";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML = `${hours}h ${mins}m ${secs}s`;
        }
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
